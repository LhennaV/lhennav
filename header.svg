<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<defs>
<style>
@font-face{font-family:'PB';src:url(data:font/ttf;base64,) format('truetype');font-weight:700}
@font-face{font-family:'PM';src:url(data:font/ttf;base64,) format('truetype');font-weight:500}
.t{font-family:'PB','Poppins',Arial,sans-serif;font-weight:700;font-size:58px;fill:#fff}
.s{font-family:'PM','Poppins',Arial,sans-serif;font-weight:500;font-size:18px;fill:#ede6ff;letter-spacing:.8px}
.w1{animation:m1 9s linear infinite}
.w2{animation:m2 14s linear infinite}
.w3{animation:m1 20s linear infinite}
@keyframes m1{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes m2{from{transform:translateX(-600px)}to{transform:translateX(0)}}
.fade{animation:f 1.4s ease-out both}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
